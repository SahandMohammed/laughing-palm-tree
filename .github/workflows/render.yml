name: Render motion preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/remotion-launch-demo
    paths:
      - "src/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/render.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Render preview
        run: npm run render:preview

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: logicbloom-motion-preview
          path: out/logicbloom-preview.mp4
          if-no-files-found: error
          retention-days: 14
