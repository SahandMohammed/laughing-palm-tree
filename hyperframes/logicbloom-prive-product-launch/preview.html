<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LogicBloom × Privé Production Preview</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#dfe7f1}
    iframe{border:0;width:100vw;height:100vh}
  </style>
</head>
<body>
  <iframe id="preview-frame" src="index.html"></iframe>
  <script>
    const frame=document.getElementById("preview-frame");
    const url=new URL("index.html",location.href);
    for(const [key,value] of new URL(location.href).searchParams) url.searchParams.set(key,value);
    frame.src=url.toString();
  </script>
</body>
</html>
